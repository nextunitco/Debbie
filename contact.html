<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | OA.DEV</title>
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #94a3b8;
            --accent: #00d2ff;
            --whatsapp: #25D366;
            --bg-deep: #020617;
            --glass: rgba(15, 23, 42, 0.6);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body, html {
            min-height: 100%;
            background-color: var(--bg-deep);
            color: var(--primary);
            overflow-x: hidden;
        }

        /* --- SLIDESHOW BACKGROUND --- */
        .slideshow-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: #000;
        }

        .slideshow-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(2, 6, 23, 0.3) 0%, rgba(2, 6, 23, 0.8) 100%);
            z-index: 2;
        }

        .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 1;
            transition: opacity 2s ease-in-out, transform 8s ease-out;
            z-index: 1;
        }

        .slide.active {
            opacity: 0.6;
            transform: scale(1.1);
        }

        /* --- NAVIGATION (FROM INDEX.HTML) --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            position: fixed;
            width: 100%;
            z-index: 100;
            background: rgba(2, 6, 23, 0.4);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        .logo { font-size: 1.5rem; font-weight: 800; text-decoration: none; color: #fff; letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        
        .nav-menu { display: flex; gap: 30px; }
        .nav-menu a { 
            text-decoration: none; 
            color: var(--secondary); 
            font-size: 0.85rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s; 
        }
        .nav-menu a:hover { color: var(--accent); }
        .nav-menu a.active { color: #fff; border-bottom: 2px solid var(--accent); }

        /* --- MAIN CONTENT --- */
        .main-container {
            padding: 140px 8% 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- CONTACT CARD --- */
        .contact-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 50px;
            border-radius: 32px;
            backdrop-filter: blur(20px);
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .contact-card h1 { 
            font-size: 2.5rem; 
            font-weight: 800; 
            margin-bottom: 10px; 
        }
        .contact-card h1 span { color: var(--accent); }
        .subtitle { 
            color: var(--secondary); 
            margin-bottom: 30px; 
            font-size: 0.95rem; 
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--whatsapp);
            color: #fff;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            margin-bottom: 25px;
            transition: 0.3s;
        }
        .btn-whatsapp:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2); }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--primary);
            transition: 0.3s;
        }
        .info-item:hover { background: rgba(255, 255, 255, 0.06); }
        .info-item .label { 
            font-size: 0.65rem; 
            color: var(--accent); 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            display: block;
        }
        .info-item p { font-size: 0.9rem; }

        form { display: grid; gap: 15px; }
        input, textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            width: 100%;
            font-family: inherit;
        }
        input:focus, textarea:focus { 
            border-color: var(--accent); 
            outline: none; 
            background: rgba(255, 255, 255, 0.08); 
        }

        .btn-send {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-send:hover { 
            transform: scale(1.02); 
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); 
        }

        /* --- FOOTER (FROM INDEX.HTML) --- */
        footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 30px 8%;
            font-size: 0.7rem;
            color: var(--secondary);
            position: relative;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .nav-menu { display: none; }
            .contact-card { padding: 30px 20px; }
            .contact-card h1 { font-size: 1.8rem; }
            footer { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="slideshow-container">
        <img src="code1.jpg" class="slide active" alt="Slide 1">
        <img src="code2.jpg" class="slide" alt="Slide 2">
        <img src="code3.jpg" class="slide" alt="Slide 3">
        <img src="code4.jpg" class="slide" alt="Slide 4">
    </div>

    <nav>
        <a href="index.html" class="logo">OA<span>.DEV</span></a>
        <div class="nav-menu">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <main class="main-container">
        <div class="contact-card">
            <h1>Let's <span>Connect</span></h1>
            <p class="subtitle">Bowen University Computer Science Student</p>
            
            <a href="https://wa.me/2349013254507" target="_blank" class="btn-whatsapp">
                Chat on WhatsApp
            </a>

            <div class="info-grid">
                <a href="mailto:olukayodeanuoluwapo19@gmail.com" class="info-item">
                    <span class="label">Official Email</span>
                    <p>olukayodeanuoluwapo19@gmail.com</p>
                </a>
            </div>

            <form action="https://formspree.io/f/your-id" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email Address" required>
                <textarea name="message" placeholder="How can I help you today?" rows="4" required></textarea>
                <button type="submit" class="btn-send">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <div>© 2026 Olukayode Anuoluwapo</div>
        <div style="color: var(--accent)">B.Sc Computer Science // Bowen University</div>
    </footer>

    <script>
        // Slideshow Logic
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;
        const slideInterval = 6000;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(nextSlide, slideInterval);
    </script>
</body>
</html>
